[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanuprtx"
version = "0.2.1"
description = "Website and Google Search Console cleanup for Inspector Roofing, with Keychain-held credentials and per-repair approval."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Richard Amir Nasser"}]
keywords = ["wordpress", "search console", "structured data", "seo", "breakdance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
cleanuprtx = "cleanuprtx.cli:main"

[tool.setuptools.packages.find]
include = ["cleanuprtx*"]
